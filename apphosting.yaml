# Firebase App Hosting configuration for Astro SSR.
# PORT is injected by App Hosting and must not be hard-coded here.
scripts:
  buildCommand: npm run build
  runCommand: npm run start

runConfig:
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Token fine-grained de solo lectura (Contents) sobre penke-ec, que es privado.
  # Lo usan el build (fetch-installer.mjs) y el servidor (descargas y actualizador).
  - variable: GITHUB_TOKEN
    secret: penke-github-token
    availability:
      - BUILD
      - RUNTIME
